<html lang="tr">
<head>

<title>Fiyat Paneli</title>

<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#0f1e3d;--mute:#56647f;--line:#d9e0ee;--acc:#14367f;--accink:#fff;--gold:#b8923a;--bad:#b3261e;--range:rgba(20,54,127,.13);--ring:#14367f;--shadow:0 1px 2px rgba(15,30,61,.06),0 10px 28px -14px rgba(15,30,61,.25);
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081125;--card:#111e39;--ink:#eaf0fb;--mute:#9fb0cf;--line:#223459;--acc:#d2ad56;--accink:#1a1405;--gold:#d2ad56;--bad:#ff8a80;--range:rgba(210,173,86,.22);--ring:#d2ad56;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
.cal,.dil,button{-webkit-user-select:none;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 360px at 50% 0,rgba(20,54,127,.10),transparent);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,sans-serif;min-height:100vh}
.hero{background:linear-gradient(165deg,#0c1d4a,#07122e 65%,#050c22);border-bottom:3px solid var(--gold);padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;box-shadow:0 8px 24px -12px rgba(5,12,34,.6)}
.hero-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:18px}
.logo{width:92px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
h1{font:700 40px/1.05 "Cormorant Garamond",Georgia,serif;margin:0;color:#fff;letter-spacing:.01em}
.sub{color:var(--mute)}
.hero .sub{margin:6px 0 0;color:#c4d0ea;font-size:14px}
main{max-width:760px;margin:0 auto;padding:22px 16px 48px}
h2{font:700 24px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
#sonuc{border-left:4px solid var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.logo{width:72px}h1{font-size:32px}}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
input:disabled{opacity:.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
button{font:600 16px Figtree,system-ui,sans-serif;border:0;border-radius:10px;padding:12px 18px;min-height:44px;cursor:pointer;background:var(--acc);color:var(--accink)}
.total{font:700 52px/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:-.01em}
.warn{color:var(--bad);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
td.r,th.r{text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
textarea{min-height:440px;line-height:1.5;resize:vertical}
@media(prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover{filter:brightness(1.1)}}
.grid>*{min-width:0}
.full{grid-column:1/-1}
.dp-btn{width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:11px 12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font:700 22px "Cormorant Garamond",Georgia,serif}
.cal .nav,.cal .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cal .nav{min-width:44px;padding:0;font-size:20px}
.cal .nav:disabled,.cal .d:disabled{opacity:.3;cursor:default}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cal-w span{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{background:transparent;color:var(--ink);padding:0;min-height:42px;border-radius:0;font-weight:600;font-size:15px}
.cal .d.in{background:var(--range)}
.cal .d.s,.cal .d.e{background:var(--acc);color:var(--accink)}
.cal .d.s{border-radius:10px 0 0 10px}
.cal .d.e{border-radius:0 10px 10px 0}
.cal .d.solo{border-radius:10px}
.cal .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cal .foot .acts{display:flex;gap:8px}
.cal .foot button{min-height:40px;padding:8px 14px;font-size:15px}
.dil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.dil button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 4px;min-height:42px;font-size:14px;font-weight:600}
.dil button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
</style>
</head>

    "Standart Fiyatımız: "+x.std,"İndirimli Fiyatımız: "+x.ind,"",

    "İptal Koşulu:","Giriş tarihine 3 gün kalana kadar yapılan iptallerde ön ödeme iade edilir.","Son 3 gün içinde yapılan iptallerde ön ödeme iade edilmez.","",
    "Belirtilen şartlar size uygunsa eğer rezervasyon işlemlerine devam edebilmemiz adına isim–soy isim bilgilerinizi bizimle paylaşmanızı rica ederiz."],
  en:x=>["Hello 🌿","","Thank you for contacting us about your holiday plans. We would be delighted to assist you.","",
    "📅 Check-in Date: "+x.gir,"📅 Check-out Date: "+x.cik,"🌙 Length of Stay: "+x.sure,"👤 Guests and Rooms:","Room 1 - "+x.kisi,"",

  ru:x=>["Здравствуйте 🌿","","Благодарим вас за обращение по поводу планирования отпуска. Мы будем рады вам помочь.","",
    "📅 Дата заезда: "+x.gir,"📅 Дата выезда: "+x.cik,"🌙 Продолжительность проживания: "+x.sure,"👤 Количество гостей и номеров:","Номер 1 - "+x.kisi,"",
    "Наша стандартная цена: "+x.std,"Наша цена со скидкой: "+x.ind,"",

    "Если указанные условия вам подходят, просим сообщить ваши имя и фамилию, чтобы мы могли продолжить оформление бронирования."],

    "📅 Anreisedatum: "+x.gir,"📅 Abreisedatum: "+x.cik,"🌙 Aufenthaltsdauer: "+x.sure,"👤 Personen und Zimmer:","1. Zimmer - "+x.kisi,"",
    "Unser Standardpreis: "+x.std,"Unser Preis mit Rabatt: "+x.ind,"",
    "Konzept:","* Ultra All Inclusive À la Carte","",
    "Um Ihre Reservierung zu bestätigen, ist eine Anzahlung in Höhe von 30 % des Gesamtbetrags erforderlich.","Nach Eingang der Anzahlung wird Ihre Reservierung auf Ihren Namen garantiert.","",
    "Stornobedingungen:","Bei Stornierungen bis 3 Tage vor dem Anreisedatum wird die Anzahlung erstattet.","Bei Stornierungen innerhalb der letzten 3 Tage wird die Anzahlung nicht erstattet.","",
    "Sofern Ihnen diese Bedingungen zusagen, bitten wir Sie, uns Ihren Vor- und Nachnamen mitzuteilen, damit wir Ihre Reservierung fortsetzen können."]

function mesajYaz(){
  const kart=$("mesajKart");
  if(!SON){ kart.hidden=true; return; }
  const {g,c,n,a_,c06,c711,toplam}=SON, [r]=IND[$("mesajInd").value], A=ADI[DIL];
  let kisi = A.yet(a_);
  if(c711) kisi += " + "+A.coc(c711,"7-11");
  if(c06) kisi += " + "+A.coc(c06,"0-6");
  $("mesaj").value = MSG[DIL]({gir:tarihYaz(g), cik:tarihYaz(c), sure:A.gece(n), kisi, std:tl(toplam), ind:tl(toplam*(100-r)/100)}).join("\n");
  $("dilSec").querySelectorAll("button").forEach(b=>{ const on=b.dataset.dil===DIL; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); });
  $("kopyaNot").textContent="";
  kart.hidden=false;
}
function hesapla(){
  SON=null; mesajYaz();
  const g=$("giris").value, cc=$("cikis").value, a_=parseInt($("kisi").value)||0;
  const room=R[$("oda").value], box=$("sonuc"), c06=room.occ?(parseInt($("c06").value)||0):0, c711=room.occ?(parseInt($("c711").value)||0):0;
  $("c06").disabled=$("c711").disabled=!room.occ;
  if(!g||!cc){ box.innerHTML='<p class="sub" style="margin:0">Giriş ve çıkış tarihini seçince fiyat burada görünür.</p>'; return; }
  const a=new Date(g+"T12:00:00"), b=new Date(cc+"T12:00:00"), n=Math.round((b-a)/864e5);
  if(n<1){ box.innerHTML='<p class="warn" style="margin:0">Çıkış tarihi giriş tarihinden sonra olmalı.</p>'; return; }
  if(a_<1){ box.innerHTML='<p class="warn" style="margin:0">En az 1 yetişkin olmalı.</p>'; return; }
  if(room.occ && !KURAL[a_+","+c711]){ box.innerHTML=`<p class="warn" style="margin:0">${room.ad} için ${a_} yetişkin + ${c711} ücretli çocuk (7-11 yaş) kombinasyonu için rezervasyon alınmıyor.</p>`; return; }
  let toplam=0, rows="", eksik=[], liste=0;
  for(let i=0;i<n;i++){
    const d=new Date(a); d.setDate(a.getDate()+i);
    const per=donemBul(iso(d)), uzun=n>=7, hs=!uzun && hsGunler().includes(d.getDay());
    const p=odaFiyati(room,per,hs,a_,c711);
    const sabit = per && /Bayram|Yılbaşı/.test(per.ad);
    const tur = !per ? "Liste dışı" : sabit ? per.ad : (hs?"Hafta sonu":(uzun?"Hafta içi fiyatı (7+ gece)":"Hafta içi"));
    const tarih=d.toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"})+" "+gun[d.getDay()];
    if(p==null){ eksik.push(tarih); rows+=`<tr><td>${tarih}</td><td>${tur}</td><td class="r warn">Fiyat yok</td></tr>`; }
    else { toplam+=p; liste++; rows+=`<tr><td>${tarih}</td><td>${tur}</td><td class="r">${para(p)}</td></tr>`; }
  }
  const uyari = eksik.length ? `<p class="warn">${eksik.length} gece için fiyat listede yok (${eksik.slice(0,3).join(", ")}${eksik.length>3?"…":""}). Aşağıdaki toplam yalnızca fiyatı olan geceleri içerir.</p>` : "";
  const kisiler = `${a_} yetişkin` + (c711?` + ${c711} çocuk (7-11)`:"") + (c06?` + ${c06} çocuk (0-6, ücretsiz)`:"");
  const kural = room.occ ? `Hesap: ${KURAL[a_+","+c711]}` : "Villa fiyatı kişi sayısından bağımsız";
  const indirim = liste ? `<div class="scroll" style="margin-top:14px"><table><tr><th>İndirimli fiyatlar</th><th class="r">Toplam</th></tr>${IND.map(([r,ad])=>`<tr><td>%${r} ${ad}</td><td class="r"><b>${para(toplam*(100-r)/100)}</b></td></tr>`).join("")}</table></div>` : "";
  box.innerHTML=`<div class="note" style="margin:0 0 4px">${room.ad} · ${kisiler} · ${n} gece</div>
   <div class="total">${para(toplam)}</div>
   <div class="note">${liste?`Gecelik ortalama ${para(toplam/liste)} · `:""}${kural}${n>=7?" · 7+ gece: tüm geceler hafta içi fiyatı":""}</div>
   ${uyari}
   ${indirim}
   <div class="scroll" style="margin-top:14px"><table><tr><th>Gece</th><th>Tür</th><th class="r">Fiyat</th></tr>${rows}</table></div>`;
  if(!eksik.length && liste){ SON={g:a,c:b,n,a_,c06,c711,toplam}; } mesajYaz();
}

$("mesajInd").innerHTML = IND.map(([r,ad],i)=>`<option value="${i}">%${r} ${ad}</option>`).join(""); $("mesajInd").value = "3";
$("mesajInd").addEventListener("input",mesajYaz);
$("dilSec").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!b.dataset.dil) return; DIL=b.dataset.dil; mesajYaz(); });
$("kopyala").addEventListener("click",async()=>{ const t=$("mesaj"); let ok=false; try{ await navigator.clipboard.writeText(t.value); ok=true; }catch(e){ try{ t.select(); ok=document.execCommand("copy"); }catch(e2){} } $("kopyaNot").textContent = ok ? "Kopyalandı." : "Kopyalanamadı; metni seçip elle kopyala."; });
$("oda").innerHTML = R.map((r,i)=>`<option value="${i}">${r.ad}</option>`).join("");
["giris","cikis","kisi","c06","c711","oda"].forEach(id=>$(id).addEventListener("input",hesapla));
// Tarih aralığı takvimi: önce giriş, sonra çıkış tarihi seçilir
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const T_MIN="2026-11-18", T_GIRIS_MAX="2027-12-31", T_CIKIS_MAX="2028-01-01";
const AY_MIN=2026*12+10, AY_MAX=2028*12;
const bugun=new Date(), ay0=Math.min(AY_MAX,Math.max(AY_MIN,bugun.getFullYear()*12+bugun.getMonth()));
let tg="", tc="", ty=Math.floor(ay0/12), tm=ay0%12;
const p2=n=>String(n).padStart(2,"0");
const kisaTarih=s=>new Date(s+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"});
function aralikMetin(){
  let t="📅 Tarih seç";
  if(tg&&tc){ const n=Math.round((new Date(tc+"T12:00:00")-new Date(tg+"T12:00:00"))/864e5); t=`📅 ${kisaTarih(tg)} → ${kisaTarih(tc)} · ${n} gece`; }
  else if(tg) t=`📅 ${kisaTarih(tg)} → çıkışı seç`;
  $("aralikMetin").textContent=t;
}
function takvimCiz(){
  const off=(new Date(ty,tm,1).getDay()+6)%7, dim=new Date(ty,tm+1,0).getDate(), ayNo=ty*12+tm;
  let g="";
  for(let i=0;i<off;i++) g+="<span></span>";
  for(let d=1;d<=dim;d++){
    const s=`${ty}-${p2(tm+1)}-${p2(d)}`;
    const dis = s<T_MIN || s>T_CIKIS_MAX || ((!tg||tc) && s>T_GIRIS_MAX);
    let cls="d";
    if(s===tg) cls+=" s"+(tc?"":" solo"); else if(s===tc) cls+=" e"; else if(tg&&tc&&s>tg&&s<tc) cls+=" in";
    g+=`<button type="button" class="${cls}" data-s="${s}" ${dis?"disabled":""} aria-label="${kisaTarih(s)}">${d}</button>`;
  }
  const ipucu = !tg ? "Giriş tarihini seç" : (!tc ? "Şimdi çıkış tarihini seç" : "Tarihler seçildi");
  $("takvim").innerHTML=`<div class="cal-h"><button type="button" class="nav" data-nav="-1" aria-label="Önceki ay" ${ayNo<=AY_MIN?"disabled":""}>‹</button><b>${AYLAR[tm]} ${ty}</b><button type="button" class="nav" data-nav="1" aria-label="Sonraki ay" ${ayNo>=AY_MAX?"disabled":""}>›</button></div>
   <div class="cal-w">${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<span>${x}</span>`).join("")}</div><div class="cal-g">${g}</div>
   <div class="foot"><span class="note" style="margin:0">${ipucu}</span><span class="acts"><button type="button" class="ghost" data-act="temizle">Temizle</button><button type="button" data-act="tamam">Tamam</button></span></div>`;
}
function tarihYazDegis(){ $("giris").value=tg; $("cikis").value=tc; aralikMetin(); hesapla(); }
function takvimAc(){ $("takvim").hidden=false; $("aralik").setAttribute("aria-expanded","true"); if(tg){ ty=+tg.slice(0,4); tm=+tg.slice(5,7)-1; } takvimCiz(); }
function takvimKapat(){ $("takvim").hidden=true; $("aralik").setAttribute("aria-expanded","false"); }
$("aralik").addEventListener("click",()=>$("takvim").hidden?takvimAc():takvimKapat());
document.addEventListener("keydown",e=>{ if(e.key==="Escape") takvimKapat(); });
$("takvim").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.nav){ const ay=ty*12+tm+Number(b.dataset.nav); ty=Math.floor(ay/12); tm=ay%12; takvimCiz(); return; }
  if(b.dataset.act==="tamam"){ takvimKapat(); return; }
  if(b.dataset.act==="temizle"){ tg=""; tc=""; tarihYazDegis(); takvimCiz(); return; }
  const s=b.dataset.s; if(!s) return;
  if(!tg||tc||s<=tg){ tg=s; tc=""; } else { tc=s; }
  tarihYazDegis(); takvimCiz();
  if(tc) takvimKapat();
});
// Otomatik güncelleme: ana ekrandaki uygulama eski sürümde kalmasın
const SURUM="2026-11-25-1";
async function surumKontrol(){
  try{
    const r=await fetch(location.pathname+"?kontrol="+Date.now(),{cache:"no-store"});
    const m=(await r.text()).match(/SURUM="(\d{4}-\d\d-\d\d-\d+)"/);
    if(m && m[1]!==SURUM && !location.search.includes("v="+m[1])) location.replace(location.pathname+"?v="+m[1]);
  }catch(e){}
}
surumKontrol();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) surumKontrol(); });
hesapla();
</script>
